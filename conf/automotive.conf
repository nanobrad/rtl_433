# Automotive-focused rtl_433 configuration
#
# Disables all default decoders, then enables only TPMS and automotive RF protocols.
#
# TPMS frequency notes:
#   North America: 315 MHz  -> add -f 315M to command line
#   Europe/Global: 433.92 MHz (default)
#   Some sensors require higher sample rates, noted per protocol below.
#
# Usage examples:
#   rtl_433 -c automotive.conf -f 433.92M
#   rtl_433 -c automotive.conf -f 315M
#   rtl_433 -c automotive.conf -f 315M -f 433.92M -H 30

## Disable all default protocols, then enable only automotive ones below
protocol 0

## ---- TPMS (Tire Pressure Monitoring Systems) ----

protocol 59   # Steelmate TPMS
protocol 60   # Schrader TPMS
protocol 82   # Citroen TPMS
protocol 88   # Toyota TPMS
protocol 89   # Ford TPMS
protocol 90   # Renault TPMS
protocol 95   # Schrader TPMS EG53MA4 (Saab, Opel, Vauxhall, Chevrolet)
protocol 110  # PMV-107J Toyota TPMS
protocol 123  # Jansite TPMS Model TY02S
protocol 140  # Elantra 2012 TPMS
protocol 156  # Abarth 124 Spider TPMS
protocol 168  # Schrader TPMS SMD3MA4 (Subaru, Infiniti, Nissan, Renault)
protocol 180  # Jansite TPMS Model Solar
protocol 186  # Hyundai TPMS (VDO)
protocol 201  # Unbranded Solar TPMS for trucks
protocol 203  # Porsche Boxster/Cayman TPMS
protocol 208  # AVE TPMS
protocol 212  # Renault 0435R TPMS
protocol 225  # TyreGuard 400 TPMS
protocol 226  # Kia TPMS  (note: requires -s 1000k)
protocol 241  # EezTire E618, Carchet TPMS, TST-507 TPMS
protocol 248  # Nissan TPMS
protocol 252  # BMW Gen4/Gen5 TPMS, Audi TPMS (HUF/Beru, Continental, Schrader/Sensata)
protocol 257  # BMW Gen2 and Gen3 TPMS
protocol 275  # GM Aftermarket TPMS
protocol 295  # Airpuxem TPMS TYH11_EU6_ZQ
protocol 298  # TRW TPMS OOK (OEM and Clone models)
protocol 299  # TRW TPMS FSK (OEM and Clone models)

## ---- Remote Keyless Entry / Car Keys ----

protocol 48   # Akhan 100F14 remote keyless entry
protocol 64   # Honda Car Key
protocol 93   # Ford Car Key
protocol 131  # Microchip HCS200/HCS300 KeeLoq Hopping Encoder remotes (OOK)
protocol 218  # Microchip HCS200/HCS300 KeeLoq Hopping Encoder remotes (FSK)

## ---- Automotive Accessories ----

protocol 285  # bm5-v2 12V Battery Monitor

